<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YAZUKI | Admin Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080808;
  color:white;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:#151515;
  border:1px solid #8e7137;
  border-radius:16px;
  padding:30px 24px;
  box-shadow:0 0 30px #d6ad5820;
}

.logo{
  text-align:center;
  color:#d6ad58;
  font-size:32px;
  font-weight:bold;
  letter-spacing:5px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin:10px 0 30px;
  font-size:12px;
  letter-spacing:2px;
}

label{
  display:block;
  color:#bbb;
  margin:16px 0 8px;
  font-size:13px;
}

input{
  width:100%;
  padding:14px;
  background:#080808;
  border:1px solid #444;
  border-radius:8px;
  color:white;
  outline:none;
}

input:focus{
  border-color:#d6ad58;
}

button{
  width:100%;
  padding:14px;
  margin-top:24px;
  background:#d6ad58;
  color:#080808;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

#message{
  color:#ff7777;
  text-align:center;
  margin-top:15px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="login-box">

  <div class="logo">YAZUKI</div>
  <div class="subtitle">ADMIN CONTROL PANEL</div>

  <form id="loginForm">

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">ADMIN LOGIN</button>

    <p id="message"></p>

  </form>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kkqopclkierekzqinodf.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pr7G4KKq17PnwjZfYjfL2A_BK-t1s_G";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const message = document.getElementById("message");
  message.innerText = "Logging in...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
  message.innerText = "Login failed. Please check your details.";
  return;
}

message.innerText = "Admin verified successfully!";
});

const { data: isAdmin, error: roleError } =
  await supabaseClient.rpc("is_admin");

if(roleError || isAdmin !== true){
  await supabaseClient.auth.signOut();
  message.innerText = "Access denied. Admin only.";
  return;
}

message.innerText = "Admin verified successfully!";

  message.innerText = "Login successful!";
});
</script>
</body>
</html>
